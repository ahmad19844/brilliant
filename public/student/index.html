<!doctype html><html><head><meta charset="utf-8"><title>BFIA CBT Student</title><link rel="stylesheet" href="student.css"></head><body><main><header><img src="/assets/bfia-logo.png" onerror="this.hidden=true"><h1>Brilliant Footstep Int'l Academy CBT</h1></header><section id="home"><h2>Register for examination</h2><input id="name" placeholder="Full name"><select id="gender"><option value="">Gender</option><option>Female</option><option>Male</option></select><div id="subjectChoices"></div><button onclick="register()">Register</button><hr><h2>Resume / My Subjects</h2><input id="number" placeholder="BFIA number e.g. BFIA001"><input id="accessCode" inputmode="numeric" placeholder="6-digit access code"><button onclick="lookup()">Continue</button></section><section id="mySubjects" hidden><h2 id="studentName"></h2><div id="subjectList"></div><button onclick="back()">Back</button></section><section id="exam" hidden><div class="top"><strong id="title"></strong><span id="timer">60:00</span></div><div id="nav"></div><article><h2 id="qtext"></h2><div id="options"></div></article><button onclick="previous()">Previous</button><button onclick="next()">Next</button><button class="submit" onclick="finish()">Submit exam</button></section><section id="outcome" hidden><h2>Examination result</h2><p id="score"></p><button onclick="back()">Return home</button></section><p id="notice"></p></main><script type="module" src="student.js"></script></body></html>
