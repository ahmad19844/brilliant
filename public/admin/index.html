<!doctype html><html><head><meta charset="utf-8"><title>BFIA CBT Administrator</title><link rel="stylesheet" href="admin.css"></head><body><main><header><img src="/assets/bfia-logo.png" onerror="this.hidden=true"><div><h1>BFIA Offline CBT</h1><p>Administrator Dashboard</p></div></header><section id="login"><h2>Administrator login</h2><input id="user" value="admin" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button onclick="doLogin()">Sign in</button></section><section id="panel" hidden><h2 id="welcome"></h2><div id="change" hidden><h3>Change initial password</h3><input id="adminOld" type="password" placeholder="Current password"><input id="adminNew" type="password" placeholder="New password (8+ chars)"><button onclick="changePassword()">Update password</button></div><h3>Subjects & questions</h3><div id="subjects"></div><input id="subjectName" placeholder="New subject"><button onclick="addSubject()">Add subject</button><div id="editor" hidden><h3 id="editorTitle"></h3><textarea id="question" placeholder="Question text"></textarea><input class="opt" placeholder="Option A"><input class="opt" placeholder="Option B"><input class="opt" placeholder="Option C"><input class="opt" placeholder="Option D"><select id="correct"><option>A</option><option>B</option><option>C</option><option>D</option></select><button onclick="addQuestion()">Add question</button><button onclick="publish()">Publish when 50 complete</button></div><h3>Results</h3><input id="filter" placeholder="BFIA number"><button onclick="results()">Search</button><div id="resultList"></div><p>Student LAN page: <code id="lan"></code></p></section><p id="message"></p></main><script type="module" src="admin.js"></script></body></html>
